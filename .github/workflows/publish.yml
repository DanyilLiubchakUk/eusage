name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-checks:
    uses: ./.github/workflows/windows-checks.yml

  publish:
    needs: windows-checks
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rustTargets: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin -- --locked"
          - platform: macos-15-intel
            rustTargets: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin -- --locked"
          - platform: windows-latest
            rustTargets: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc -- --locked"
          - platform: ubuntu-22.04
            rustTargets: "x86_64-unknown-linux-gnu"
            args: "--target x86_64-unknown-linux-gnu --bundles deb,appimage -- --locked"
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libclang-dev \
            patchelf xdg-utils sqlite3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"
      - run: bun install --frozen-lockfile
      - name: Bundle plugins
        run: bun run bundle:plugins
      - name: Verify bundled plugins
        run: |
          COUNT=$(find src-tauri/resources/bundled_plugins -maxdepth 2 -name plugin.json | wc -l | tr -d ' ')
          if [[ "$COUNT" -lt 1 ]]; then
            echo "No bundled plugins found under src-tauri/resources/bundled_plugins."
            exit 1
          fi

      - name: Validate release tag
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "Missing RELEASE_TAG (push a v* tag)."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid RELEASE_TAG: $RELEASE_TAG (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

      - name: Test Linux Team credential storage
        if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-unknown-linux-gnu team_credentials

      - name: Validate app version matches tag
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"

          TAURI_CONF_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          CARGO_VERSION=$(awk -F'"' '/^version =/ { print $2; exit }' ./src-tauri/Cargo.toml)
          PKG_VERSION=$(node -p 'require("./package.json").version')

          if [[ "$TAURI_CONF_VERSION" != "$TAG_VERSION" ]]; then
            echo "src-tauri/tauri.conf.json version ($TAURI_CONF_VERSION) != tag version ($TAG_VERSION)"
            exit 1
          fi
          if [[ "$CARGO_VERSION" != "$TAG_VERSION" ]]; then
            echo "src-tauri/Cargo.toml version ($CARGO_VERSION) != tag version ($TAG_VERSION)"
            exit 1
          fi
          if [[ "$PKG_VERSION" != "$TAG_VERSION" ]]; then
            echo "package.json version ($PKG_VERSION) != tag version ($TAG_VERSION)"
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_TAG }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Verify signed updater artifacts before publication
        run: |
          TARGET="${{ matrix.rustTargets }}"
          cargo run --locked --manifest-path src-tauri/Cargo.toml --target "$TARGET" \
            --example verify-updater-artifacts -- src-tauri/tauri.conf.json "src-tauri/target/$TARGET/release/bundle"

  publish-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify all installers and updater entries
        shell: bash
        run: |
          node --test scripts/verify-release-assets.test.mjs
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/release-assets.json"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --output "$RUNNER_TEMP/eusage-latest.json"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.sig' --dir "$RUNNER_TEMP/updater-signatures"
          node scripts/verify-release-assets.mjs "$RUNNER_TEMP/release-assets.json" \
            "$RUNNER_TEMP/eusage-latest.json" "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/updater-signatures"
      - name: Publish after all build and asset checks pass
        shell: bash
        run: |
          FIRST_VERSION=$(awk '/^## v/ { print $2; exit }' CHANGELOG.md)
          test "$FIRST_VERSION" = "$RELEASE_TAG"
          awk '/^## v/ { if (section++) exit } section' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --notes-file "$RUNNER_TEMP/release-notes.md"

  update-package-managers:
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Validate package repo token
        env:
          PACKAGE_REPOS_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
        run: |
          if [[ -z "$PACKAGE_REPOS_TOKEN" ]]; then
            echo "Missing PACKAGE_REPOS_TOKEN secret."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/checkout@v4
        with:
          repository: DanyilLiubchakUk/homebrew-eusage
          token: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          path: package-repos/homebrew-eusage

      - uses: actions/checkout@v4
        with:
          repository: DanyilLiubchakUk/scoop-eusage
          token: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          path: package-repos/scoop-eusage

      - name: Download release installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          ASSET_DIR="release-assets"
          ASSETS=(
            "eUsage_${VERSION}_aarch64.dmg"
            "eUsage_${VERSION}_x64.dmg"
            "eUsage_${VERSION}_x64-setup.exe"
          )

          for ATTEMPT in 1 2 3 4 5; do
            rm -rf "$ASSET_DIR"
            mkdir -p "$ASSET_DIR"

            if gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$ASSET_DIR" \
              --pattern "${ASSETS[0]}" \
              --pattern "${ASSETS[1]}" \
              --pattern "${ASSETS[2]}"; then
              MISSING=0
              for ASSET in "${ASSETS[@]}"; do
                if [[ ! -f "$ASSET_DIR/$ASSET" ]]; then
                  echo "Missing release asset: $ASSET"
                  MISSING=1
                fi
              done
              if [[ "$MISSING" -eq 0 ]]; then
                exit 0
              fi
            fi

            echo "Release assets not ready yet. Retry $ATTEMPT/5."
            sleep 15
          done

          exit 1

      - name: Update package manager manifests
        env:
          RELEASE_ASSET_DIR: release-assets
          HOMEBREW_REPO_PATH: package-repos/homebrew-eusage
          SCOOP_REPO_PATH: package-repos/scoop-eusage
        run: node scripts/update-package-manager-manifests.mjs

      - name: Commit Homebrew cask
        working-directory: package-repos/homebrew-eusage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- Casks/eusage.rb; then
            echo "Homebrew cask already current."
            exit 0
          fi

          git add Casks/eusage.rb
          git commit -m "chore: update eusage to ${RELEASE_TAG}"
          git push

      - name: Commit Scoop manifest
        working-directory: package-repos/scoop-eusage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- bucket/eusage.json; then
            echo "Scoop manifest already current."
            exit 0
          fi

          git add bucket/eusage.json
          git commit -m "chore: update eusage to ${RELEASE_TAG}"
          git push
